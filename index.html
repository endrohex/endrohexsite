<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Theme & App Colors -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Favicons & Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Web Manifest -->
    <link rel="manifest" href="/site.webmanifest">

    <!-- Primary SEO Meta Tags -->
    <title>Endrohex | Full Stack Developer | Creative Agency</title>
    <meta name="description" content="Full Stack Developer building intelligent, scalable and beautiful digital experiences." />
    <meta name="keywords" content="web development, full stack developer, portfolio, branding, creative agency, 3d design, cgi, vfx, motion graphics, ui ux design, Endrohex" />
    <link rel="canonical" href="https://endrohex.com" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://endrohex.com" />
    <meta property="og:title" content="Endrohex" />
    <meta property="og:description" content="Full Stack Developer building intelligent, scalable and beautiful digital experiences." />
    <meta property="og:image" content="https://endrohex.com/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://endrohex.com" />
    <meta name="twitter:title" content="Endrohex" />
    <meta name="twitter:description" content="Full Stack Developer building intelligent, scalable and beautiful digital experiences." />
    <meta name="twitter:image" content="https://endrohex.com/twitter-image.jpg" />

    <!-- Google Search Console & Bing Webmaster Tools verification -->
    <meta name="google-site-verification" content="GOOGLE_VERIFICATION_PLACEHOLDER" />
    <meta name="msvalidate.01" content="BING_VERIFICATION_PLACEHOLDER" />

    <!-- Google Analytics (gtag.js) Placeholder - Replace G-PLACEHOLDER with your actual Measurement ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PLACEHOLDER" id="google-analytics-script"></script>
    <script>
      if (window.location.hostname === 'endrohex.com') {
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-PLACEHOLDER');
      }
    </script>

    <!-- Schema.org JSON-LD Structured Data for Personal Portfolio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Endrohex",
        "url": "https://endrohex.com",
        "jobTitle": "Full Stack Developer",
        "description": "Full Stack Developer building intelligent, scalable and beautiful digital experiences."
      }
    </script>

    <!-- Google Fonts Preconnections & Stylesheets Loading (Unified Inter, Space Grotesk, Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body, #root {
        background-color: #0A0A0A;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
